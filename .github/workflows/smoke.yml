name: Smoke checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Install project
        run: python -m pip install .
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Check simple commands
        run: |
          tracetune --version
          tracetune presets
          tracetune inspect examples/papirus/audio-volume-high.svg
      - name: Run balanced optimization
        run: |
          tracetune optimize examples/mask.png outputs/smoke/optimized.svg --quality 65
          test -s outputs/smoke/optimized.svg
          test -s outputs/smoke/optimized.png
          test -s outputs/smoke/optimized.diff.png
