[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tracetune"
version = "0.2.0"
description = "Convert high-contrast raster logos into compact SVG paths with visual quality checks"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["svg", "vectorization", "logo", "bezier", "opencv"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
  "numpy>=1.23",
  "opencv-python-headless>=4.7",
  "scipy>=1.9",
]

[project.urls]
Homepage = "https://github.com/PiRifle/tracetune"
Repository = "https://github.com/PiRifle/tracetune"
Issues = "https://github.com/PiRifle/tracetune/issues"

[project.scripts]
tracetune = "tracetune.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
